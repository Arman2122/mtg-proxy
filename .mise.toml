[tools]
rust = "stable"

[tasks.build]
description = "Build optimized Linux release binary"
run = "cargo build --release --bin mtg-proxy"

[tasks.bench]
description = "Build release proxy + A/B benchmark harness"
run = "cargo build --release --bin mtg-proxy --bin mtg-bench"

[tasks.fmt]
description = "Format all Rust workspace crates"
run = "cargo fmt --all"

[tasks.lint]
description = "Check formatting and strict Clippy (-D warnings)"
run = [
    "cargo fmt --all -- --check",
    "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.test]
description = "Run full Rust workspace test suite"
run = "cargo test --workspace"

[tasks.image]
description = "Build multi-stage Linux container image"
run = "docker buildx build --pull -t mtg-proxy ."
