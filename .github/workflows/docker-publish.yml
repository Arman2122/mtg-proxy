name: Docker

on:
  push:
    branches:
      - main
    tags:
      - v*

# Least privilege by default; the publishing job widens this for itself, so a
# job added to this file later does not silently inherit the right to mint an
# OIDC token.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the arm64 leg is QEMU-emulated and slow
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # Sigstore OIDC identity for the provenance attestation
      attestations: write # store the attestation against this repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the Dockerfile derives its version from git describe

      # A container reference must be lowercase, and this repository's owner is
      # not. metadata-action lowercases its `images` input on its own, but the
      # attestation subject below is passed through verbatim, so both take the
      # value computed here.
      - name: Resolve image name
        id: image
        run: |
          set -eu
          echo "name=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          # latest=false plus the explicit raw tag below: `latest` must mean
          # "the newest tagged release", never "whatever last landed on main".
          # The README points operators at :latest, so a main push moving it
          # would ship them unreleased code.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=max records the build inputs, not just the outputs, in the
          # in-toto provenance BuildKit embeds in the pushed index.
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # BuildKit's own provenance above lives inside the image index. This adds
      # the GitHub/Sigstore attestation, which is what `gh attestation verify`
      # checks and what ties the image to this workflow and commit:
      #   gh attestation verify oci://ghcr.io/arman2122/mtg-proxy:<tag> \
      #     --repo Arman2122/mtg-proxy \
      #     --signer-workflow Arman2122/mtg-proxy/.github/workflows/docker-publish.yml
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
