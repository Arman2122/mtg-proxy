version: 2

# A SHA-pinned action and a digest-pinned base image are only as good as the
# thing that refreshes them; without this they rot into "pinned to a version
# with a known CVE". Dependabot rewrites both the digest and the trailing
# `# vX.Y.Z` comment, so the pins stay readable.
#
# Not covered here, and therefore hand-maintained:
#   - the gitleaks version and sha256 in .github/workflows/ci.yaml
#   - Go tool versions in .mise.toml / mise.lock (`mise run update`)
#   - Go module dependencies, which this project updates deliberately rather
#     than one pull request at a time.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    # Patch and digest bumps only, on purpose. The base image is pinned to the
    # exact Go release named in go.mod so the image and the release binaries
    # are the same program. go.mod names a full patch version, and setup-go
    # installs exactly that one even with check-latest (which only moves a
    # bare minor like `1.26`), so a patch bump here does NOT carry the release
    # job along: land it together with the same bump to go.mod, .mise.toml and
    # mise.lock. A 1.27 bump would put them on different lines altogether --
    # move go.mod first, then let this follow.
    ignore:
      - dependency-name: "golang"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
