# The users are dotted keys of the top level, so there is no [secrets] header.
bind-to = "0.0.0.0:3128"
secrets.alice = "eea1a1a1a1b2b2b2b2c3c3c3c3d4d4d4d473746f726167652e676f6f676c65617069732e636f6d"
secrets.bob = 'ddb5b5b5b5c6c6c6c6d7d7d7d7e8e8e8e8'
concurrency = 64

[[listener]]
bind-to = "127.0.0.1:2398"
accept = ["dd"]

[network.timeout]
tcp = "5s"
