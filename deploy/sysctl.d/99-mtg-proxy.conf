# Production Linux kernel network tuning for high-throughput mtg-proxy nodes.
# Install to /etc/sysctl.d/99-mtg-proxy.conf and run: sysctl --system

# Modern congestion control (BBR + FQ pacing)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Large listen backlogs & SYN queues for bursty mobile handshakes
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# High-bandwidth TCP socket buffer ceilings (auto-tuned per socket)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Fast ephemeral port reuse and broad outbound port range for Telegram DCs
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_ecn = 0
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_notsent_lowat = 16384

# File descriptor ceiling for 100k+ concurrent connections
fs.file-max = 2097152
